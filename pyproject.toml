[project]
name = "space_weather_analysis"
version = "0.1.0"
description = ""
authors = [
    { name = "Patrick Heß", email = "hepa1041@h-ka.de" },
    { name = "Sebastian Straßner", email = "stse1032@h-ka.de" },
]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "matplotlib>=3.10.7,<4",
    "scipy>=1.16.3,<2",
    "cdflib>=1.3.6,<2",
    "pandas>=2.2.3,<3",
    "pymongo>=4.12.0,<5",
    "astropy>=7.1.1,<8",
    "sunpy[asdf, dask, image, jpeg2000, map, net, timeseries, visualization]>=7.0.3,<8",
    "lxml>=6.0.2,<7",
    "zeep>=4.3.2,<5",
    "drms>=0.9.0,<0.10",
    "contourpy>=1.3.3,<2",
    "mpl-animators>=1.2.4,<2",
    "reproject>=0.18.0,<0.19",
    "h5netcdf>=1.7.3,<2",
    "h5py>=3.15.1,<4",
    "xarray>=2025.10.1,<2026",
    "netcdf4>=1.7.3,<2",
    "pyarrow>=21.0.0,<22",
    "cdasws>=1.8.11,<2",
    "hapiclient>=0.2.6,<0.3",
    "streamlit>=1.51.0,<2",
    "plotly>=6.5.0,<7",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-mock>=3.14.1,<4",
    "jupyterlab>=4.3.6,<5",
    "pandas-stubs>=2.3.2.250926,<3",
    "types-requests>=2.32.4.20250913,<3",
    "testcontainers[mongodb]>=4,<5",
    "pytest-httpserver>=1.1,<2",
    "hypothesis>=6,<7",
    "pytest-cov>=6,<7",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m", "not integration",
]
markers = [
    "integration: tests that start a throwaway MongoDB via Docker (testcontainers)",
]

# --- Tool Configuration ---

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (Import sorting)
    "B",  # flake8-bugbear (Likely bugs)
    "D",  # pydocstyle (Docstring conventions)
    "BLE",  # flake8-blind-except (catching every exception hides failures)
    "TRY400",  # logging.exception instead of logging.error in except blocks
    "RUF012",  # mutable class attributes
    "DTZ",  # flake8-datetimez (naive datetimes)
    "UP",  # pyupgrade (current syntax for the target Python version)
    "PIE",  # flake8-pie (unnecessary statements)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PERF",  # perflint (avoidable slow loops)
    "ARG",  # flake8-unused-arguments
    "G004",  # f-strings in logging calls, which format before the level check
]
# Modules and packages are documented by their names and contents, not by file-level docstrings.
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
# Files not yet cleaned for the rules above, each with exactly the rules it still violates;
# a file is removed from this list when it is cleaned.
"src/pipeline_service/parsing/diagnostics.py" = ["G004", "UP006", "UP035", "UP045"]
"src/pipeline_service/parsing/file_parser.py" = ["BLE001", "G004", "PERF401", "UP006", "UP007", "UP035", "UP045"]
"src/pipeline_service/parsing/netcdf.py" = ["BLE001", "G004", "SIM102", "UP006", "UP035", "UP045"]
"src/pipeline_service/parsing/time_decoding.py" = ["BLE001", "G004", "UP006", "UP007", "UP017", "UP035", "UP045"]
"src/space_weather_analysis/coverage/repository.py" = ["UP006", "UP017", "UP035", "UP045"]
"src/space_weather_analysis/database/bulk.py" = ["G004", "UP007", "UP035"]
"src/space_weather_analysis/metadata/normalize.py" = ["UP045"]
"src/space_weather_analysis/util/types.py" = ["UP006", "UP035", "UP040"]
"src/streamlit_app/plots/kp.py" = ["RET505"]
"src/streamlit_app/plots/sunspots.py" = ["PERF401"]
"src/streamlit_app/plots/xray.py" = ["UP045"]
"src/streamlit_app/util/stats.py" = ["G004"]
"tests/integration/coverage/test_coverage_repository.py" = ["UP006", "UP017", "UP035"]
"tests/unit/metadata/test_hapi_metadata.py" = ["UP006", "UP017", "UP035", "UP045"]
"tests/unit/parsing/test_netcdf.py" = ["DTZ001", "UP006", "UP035"]
"tests/unit/parsing/test_time_decoding.py" = ["DTZ001", "UP006", "UP017", "UP035"]
# Test classes only group test functions; each test function carries its own docstring.
# Pytest fixtures are requested as arguments for their side effects, so unused arguments are expected.
"tests/**" = ["D101", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# Lets mypy understand pydantic models, including settings fields filled from the environment.
plugins = ["pydantic.mypy"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
# Resolves imports from src/ the same way PYTHONPATH and pytest do.
mypy_path = "src"
explicit_package_bases = true
show_error_codes = true
# Lenient settings to avoid blocking development:
ignore_missing_imports = true
warn_redundant_casts = true

# Pyright is the engine behind Pylance and serves editor features; mypy is the type checker.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# Type checking stays with mypy: Pyright does not know pydantic-settings fills fields from the environment.
typeCheckingMode = "off"
