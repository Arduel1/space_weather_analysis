[tool.poetry]
name = "space_weather_analysis"
version = "0.1.0"
description = ""
authors = ["Patrick Heß <hepa1041@h-ka.de>", "Sebastian Straßner <stse1032@h-ka.de>"]
readme = "README.md"
package-mode = true
packages = [{ include = "space_weather_analysis", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.1.1"
matplotlib = "^3.10.7"
scipy = "^1.16.3"
cdflib = "^1.3.6"
pandas = "^2.2.3"
pymongo = "^4.12.0"
astropy = "^7.1.1"
sunpy = {version = "^7.0.3", extras = ["asdf", "dask", "image", "jpeg2000", "map", "net", "timeseries", "visualization"]}
lxml = "^6.0.2"
zeep = "^4.3.2"
drms = "^0.9.0"
contourpy = "^1.3.3"
mpl-animators = "^1.2.4"
reproject = "^0.18.0"
h5netcdf = "^1.7.3"
h5py = "^3.15.1"
xarray = "^2025.10.1"
netcdf4 = "^1.7.3"
pyarrow = "^21.0.0"
cdasws = "^1.8.11"
hapiclient = "^0.2.6"
streamlit = "^1.51.0"
plotly = "^6.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-mock = "^3.14.1"
jupyterlab = "^4.3.6"
pandas-stubs = "^2.3.2.250926"
types-requests = "^2.32.4.20250913"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Tool Configuration ---

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (Import sorting)
    "B",  # flake8-bugbear (Likely bugs)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# Lenient settings to avoid blocking development:
ignore_missing_imports = true
warn_redundant_casts = true
