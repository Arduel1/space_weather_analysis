[tool.poetry]
name = "space_weather_analysis"
version = "0.1.0"
description = ""
authors = ["Patrick Heß <hepa1041@h-ka.de>", "Sebastian Straßner <stse1032@h-ka.de>"]
readme = "README.md"
package-mode = false
packages = [{ include = "space_weather_analysis", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.1.1"
pandas = "^2.2.3"
pymongo = "^4.12.0"
astropy = "^7.1.1"
sunpy = "^7.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-mock = "^3.14.1"
jupyterlab = "^4.3.6"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
