# Log files rotated at 10 MB, five kept per container
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Long-running background process for all recurring metadata requests, paced per provider host
  metadata-worker:
    build: .
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro # Curated metadata, laid over every metadata record the worker saves
    command: ["python", "-m", "catalog_collector.metadata_worker"]
    healthcheck:
      # The worker touches the file before each round, and a round runs at most one task
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/heartbeat -mmin -5)\""]
      interval: 1m
      start_period: 2m
    logging: *logging
    networks:
      - space-weather-net

  pipeline-service:
    build: .
    restart: always
    # Peak about 2.4 GB while the coronal magnetic field model is computed
    mem_limit: 3g
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data # Persist downloads
      - ./config:/app/config:ro # Feed file and curated metadata, read on every start
    command: ["python", "-m", "pipeline_service.main"]
    healthcheck:
      # The watchdog touches the file every minute
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/heartbeat -mmin -5)\""]
      interval: 1m
      start_period: 2m
    logging: *logging
    networks:
      - space-weather-net

  frontend:
    build: .
    restart: always
    depends_on:
      pipeline-service:
        condition: service_started
    env_file:
      - .env
    ports:
      # Reachable only from this host, as it queues fetch jobs without a login
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8501}:8501"
    command:
      [
        "streamlit",
        "run",
        "src/streamlit_app/main.py",
        "--server.address=0.0.0.0",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 1m
      start_period: 1m
    logging: *logging
    networks:
      - space-weather-net

  # Web dashboard, the same site as the public demo: writes the dashboard documents every minute and serves them
  dashboard:
    build: .
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${DASHBOARD_HOST_PORT:-8502}:8000"
    volumes:
      - ./config:/app/config:ro # Feed file and dashboard pages, read on every write
      - ./data:/app/data:ro # Stored frames of the image sequences, copied into the site
    environment:
      # The data directory is mounted read-only, so the caches of SPASE (Space Physics Archive Search and Extract) terms
      # live in the container
      - SPASE_DICTIONARY_CACHE_PATH=/tmp/spase_dictionary.json
      - SPASE_RESOURCE_CACHE_PATH=/tmp/spase_resources.json
    command: ["python", "-m", "site_export.main", "--web", "web", "--output", "/tmp/site", "--serve", "8000"]
    healthcheck:
      # Served only after the first write of the documents
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/data/dashboard.json', timeout=5)"]
      interval: 1m
      start_period: 5m
    logging: *logging
    networks:
      - space-weather-net

  mongo:
    image: mongo:9.0
    restart: always
    ports:
      # Reachable only from this host, for tools running outside Docker
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Ping via the container hostname, not localhost: during first-start initialization
      # the image runs a temporary mongod bound to localhost only, which must not count as healthy.
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname)\" --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    networks:
      - space-weather-net

  mongo-express:
    image: mongo-express:1.0.2
    restart: always
    ports:
      # Reachable only from this host, as it logs in with the root account of the database
      - "127.0.0.1:${MONGO_EXPRESS_HOST_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS}
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASS}
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongo:
        condition: service_healthy
    logging: *logging
    networks:
      - space-weather-net

  # One compressed dump of the database per day, the newest seven (scripts/backup.sh); restore: docs/operations.md
  backup:
    image: mongo:9.0
    restart: always
    # The dumps belong to the first user of the host, like the files the services write
    user: "1000:1000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    healthcheck:
      # The script checks every hour for the dump of the day, so the newest dump is at most a day old while the stack runs
      test: ["CMD-SHELL", "test -n \"$$(find /backups -maxdepth 1 -name '*.archive.gz' -mtime -2)\""]
      interval: 1h
      start_period: 15m
      start_interval: 1m
    logging: *logging
    networks:
      - space-weather-net

volumes:
  mongo-data:

networks:
  space-weather-net:
    driver: bridge
