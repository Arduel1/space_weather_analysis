services:
  catalog-collector:
    build: .
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "catalog_collector.main"]
    networks:
      - space-weather-net

  pipeline-service:
    build: .
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
      catalog-collector:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./data:/app/data # Persist downloads
    command: ["python", "-m", "pipeline_service.main"]
    networks:
      - space-weather-net

  # app:
  #   build: .
  #   restart: on-failure
  #   depends_on:
  #     - mongo
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./src:/app/src
  #     - ./data:/app/data

  frontend:
    build: .
    restart: always
    depends_on:
      pipeline-service:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${FRONTEND_HOST_PORT:-8501}:8501"
    command:
      [
        "streamlit",
        "run",
        "src/streamlit_app/main.py",
        "--server.address=0.0.0.0",
      ]
    networks:
      - space-weather-net

  mongo:
    image: mongo
    restart: always
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Ping via the container hostname, not localhost: during first-start initialization
      # the image runs a temporary mongod bound to localhost only, which must not count as healthy.
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname)\" --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - space-weather-net

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_HOST_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS}
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASS}
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - space-weather-net

volumes:
  mongo-data:

networks:
  space-weather-net:
    driver: bridge
