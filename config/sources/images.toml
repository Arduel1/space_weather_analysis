# Image sequences, one table per dataset ID: the frame list of the provider, how the frame time is read from the image
# path, and spacing, size and keep time of the stored frames (durations in ISO 8601).

# GOES SUVI (Solar Ultraviolet Imager) extreme ultraviolet images of the Sun, 195 Angstrom
[product.swpc_suvi_195]
list_url = "https://services.swpc.noaa.gov/products/animations/suvi-primary-195.json"
base_url = "https://services.swpc.noaa.gov"
time_pattern = '_s(\d{8}T\d{6})Z_'
time_format = "%Y%m%dT%H%M%S"
spacing = "PT12M"

