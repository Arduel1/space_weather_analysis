# Curated metadata of the SOHO/LASCO CME catalog of the CDAW Data Center. The pipeline omits the missing values (dashes
# in the catalog), so the stored documents hold no fill value.

[dataset.cme_catalog]
title = "SOHO/LASCO CME Catalog"
provider = "CDAW Data Center, NASA and The Catholic University of America, in cooperation with the Naval Research Laboratory"
resource_url = "https://cdaw.gsfc.nasa.gov/CME_list/"

[dataset.cme_catalog.citation]
text = "Yashiro, S., et al. (2004). A catalog of white light coronal mass ejections observed by the SOHO spacecraft. Journal of Geophysical Research, 109, A07105. https://doi.org/10.1029/2003JA010282; Gopalswamy, N., et al. (2009). The SOHO/LASCO CME Catalog. Earth, Moon, and Planets, 104, 295-313. https://doi.org/10.1007/s11038-008-9282-7"
acknowledgement = "This CME catalog is generated and maintained at the CDAW Data Center by NASA and The Catholic University of America in cooperation with the Naval Research Laboratory. SOHO is a project of international cooperation between ESA and NASA."
license = "No formal license; the acknowledgement is requested"

[[dataset.cme_catalog.variable]]
name = "central_pa"
units = "deg"

[[dataset.cme_catalog.variable]]
name = "width"
units = "deg"
valid_min = 0
valid_max = 360

[[dataset.cme_catalog.variable]]
name = "linear_speed"
units = "km/s"
valid_min = 0

[[dataset.cme_catalog.variable]]
name = "speed_initial"
units = "km/s"

[[dataset.cme_catalog.variable]]
name = "speed_final"
units = "km/s"

[[dataset.cme_catalog.variable]]
name = "speed_at_20r"
units = "km/s"

[[dataset.cme_catalog.variable]]
name = "accel"
units = "m/s^2"

[[dataset.cme_catalog.variable]]
name = "mass"
units = "g"

[[dataset.cme_catalog.variable]]
name = "kinetic_energy"
units = "erg"

[[dataset.cme_catalog.variable]]
name = "mpa"
units = "deg"

[[dataset.cme_catalog.reference]]
url = "https://cdaw.gsfc.nasa.gov/CME_list/catalog_description.htm"
retrieved = 2026-10-24
covers = "angular width from 0 to 360 with 360 for a halo CME, linear speed not below 0"

[[dataset.cme_catalog.reference]]
url = "https://cdaw.gsfc.nasa.gov/CME_list/"
retrieved = 2026-10-15
covers = "title, provider, acknowledgement text, reference papers, no formal license"

[[dataset.cme_catalog.reference]]
url = "https://cdaw.gsfc.nasa.gov/CME_list/UNIVERSAL_ver2/2024_01/univ2024_01.html"
retrieved = 2026-11-05
covers = "units of the columns from the table headers"
