# Curated metadata of the WDC-SILSO sunspot numbers (Royal Observatory of Belgium). Every value is taken from the
# pages listed under `reference`; `covers` names the values each page gives. Check these pages when updating a value.
# SILSO marks missing values with -1; the pipeline omits them, so the stored documents hold no fill value. The
# monthly files date each value to the middle of the month; the pipeline stores it at the first day of the month.

[dataset.silso_sunspot_daily]
title = "Daily total sunspot number, version 2.0"
description = "Daily total sunspot number of the international sunspot number series version 2.0. Values of the most recent months are provisional and revised over time."
provider = "WDC-SILSO, Royal Observatory of Belgium, Brussels"
resource_url = "https://www.sidc.be/SILSO/infosndtot"
time = { cadence = "P1D" }

[dataset.silso_sunspot_daily.citation]
doi = "10.24414/qnza-ac80"
text = "Clette, F. and Lefèvre, L. (2015). SILSO Sunspot Number V2.0. WDC-SILSO, Royal Observatory of Belgium. https://doi.org/10.24414/qnza-ac80"
acknowledgement = "Source: WDC-SILSO, Royal Observatory of Belgium, Brussels, https://doi.org/10.24414/qnza-ac80"
license = "CC BY-NC 4.0"

[[dataset.silso_sunspot_daily.variable]]
name = "sunspot_number"
label = "Sunspot number"
description = "Daily total sunspot number"
valid_min = 0

[[dataset.silso_sunspot_daily.variable]]
name = "std_dev"
label = "Standard deviation"
description = "Standard deviation of the input sunspot numbers of the individual stations"
valid_min = 0

[[dataset.silso_sunspot_daily.variable]]
name = "num_observations"
label = "Observations"
description = "Number of observations used to compute the daily value"
valid_min = 0

[[dataset.silso_sunspot_daily.variable]]
name = "is_provisional"
label = "Provisional"
description = "Whether the value is still provisional (definitive values are final)"

[[dataset.silso_sunspot_daily.variable]]
name = "decimal_year"
label = "Decimal year"
description = "Date in fraction of year"

[[dataset.silso_sunspot_daily.reference]]
url = "https://www.sidc.be/SILSO/infosndtot"
retrieved = 2026-10-25
covers = "title, columns and their meaning, -1 as missing value, provisional marker, license CC BY-NC 4.0"

[[dataset.silso_sunspot_daily.reference]]
url = "https://doi.org/10.24414/qnza-ac80"
retrieved = 2026-10-25
covers = "DOI, citation text and attribution text"

