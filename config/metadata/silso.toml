[dataset.silso_sunspot_smoothed]
title = "13-month smoothed monthly total sunspot number, version 2.0"
description = "Monthly total sunspot number smoothed by a 13-month tapered-boxcar running mean, which shows the solar cycle, stored with the first day of the month as time stamp. The first and last six months of the series have no smoothed value."
provider = "WDC-SILSO, Royal Observatory of Belgium, Brussels"
resource_url = "https://www.sidc.be/SILSO/infosnmstot"
time = { cadence = "P1M", timestamp_location = "begin" }

