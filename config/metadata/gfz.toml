# Curated metadata of the GFZ Potsdam indices. Every value is taken from the pages listed under `reference`;
# `covers` names the values each page gives. Check these pages when updating a value.

[dataset.Kp]
title = "Geomagnetic Kp index"
description = "Planetary three-hour index of geomagnetic activity, the mean standardized K index of 13 geomagnetic observatories between 44 and 60 degrees geomagnetic latitude, from 0 to 9 in steps of one third."
provider = "GFZ Helmholtz Centre for Geosciences"
resource_url = "https://kp.gfz.de/en/"
time = { cadence = "PT3H", timestamp_location = "begin" }

[dataset.Kp.citation]
doi = "10.5880/Kp.0001"
text = "Matzka, J., Bronkalla, O., Tornow, K., Elger, K. and Stolle, C. (2021). Geomagnetic Kp index. V. 1.0. GFZ Data Services. https://doi.org/10.5880/Kp.0001"
license = "CC BY 4.0"

[[dataset.Kp.variable]]
name = "Kp"
label = "Kp"
description = "Planetary geomagnetic Kp index of the three-hour interval starting at the time stamp, 0 to 9 in steps of one third"
valid_min = 0
valid_max = 9

[[dataset.Kp.variable]]
name = "status"
label = "Status"
description = "def: definitive value; pre: preliminary nowcast value, replaced by the definitive one later"

[[dataset.Kp.reference]]
url = "https://kp.gfz.de/app/format/json.txt"
retrieved = 2026-10-27
covers = "time stamp at the start of the three-hour interval, Kp in thirds from 0 to 9, meaning of status def and pre"

[[dataset.Kp.reference]]
url = "https://kp.gfz.de/en/"
retrieved = 2026-10-15
covers = "provider, license CC BY 4.0"

[[dataset.Kp.reference]]
url = "https://doi.org/10.5880/Kp.0001"
retrieved = 2026-10-15
covers = "DOI and citation text of the data publication"

[[dataset.Kp.reference]]
url = "https://www.spaceweather.gov/products/planetary-k-index"
retrieved = 2026-11-05
covers = "definition as mean standardized K index of 13 observatories between 44 and 60 degrees geomagnetic latitude"
