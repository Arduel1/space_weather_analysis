# Feeds the pipeline service keeps loaded: on every start and then every `interval` (ISO 8601 duration) it queues
# one job per feed that has no open job; a feed without interval is queued only on start.
# Each feed takes a time range of either `lookback` (ISO 8601 duration up to now) or `start` and optional `end`
# (UTC times, `end` defaults to now); a feed without range lets its pipeline choose.
# `source_type` names the pipeline; without it the job runner looks the datasets up in the master catalog.

# GOES X-ray and proton flux of the last 90 days from the iSWA HAPI server, the history behind the live feed
[[feed]]
name = "goes"
datasets = ["goesp_xray_flux_P1M", "goesp_part_flux_P5M"]
lookback = "P90D"
interval = "PT1H"

# Live GOES X-ray and proton flux of NOAA SWPC, whose rolling files are a few minutes behind the measurement
# The 7-day lookback is the longest file SWPC offers; after the first run each run fetches from the newest stored value on
[[feed]]
name = "swpc_goes"
datasets = ["swpc_goes_xray", "swpc_goes_protons"]
source_type = "SWPC"
lookback = "P7D"
interval = "PT1M"

# Kp estimated by SWPC every minute, a nowcast until GFZ publishes the official Kp
[[feed]]
name = "swpc_kp"
datasets = ["swpc_kp_estimated"]
source_type = "SWPC"
lookback = "P7D"
interval = "PT1M"

# Kp index of GFZ Potsdam
[[feed]]
name = "kp"
datasets = ["Kp"]
# Named, so the feed also runs without master catalog, as in the static demo
source_type = "GFZ_POTSDAM"
start = 2020-01-01T00:00:00Z
# One value per 3 hours; hourly fetches take up new and revised preliminary values soon after GFZ publishes them
interval = "PT1H"

# Local files, which hold their whole dataset and are not in the master catalog
[[feed]]
name = "local"
datasets = ["silso_sunspot_daily", "silso_sunspot_monthly", "silso_sunspot_smoothed", "cme_catalog"]
source_type = "LOCAL"

# What the dashboard shows of the feeds: a list of panels, drawn row by row and in file order within a row.
# Every `dataset` must belong to a feed above, so the shown data stays current; switching a panel to another
# source means naming another dataset and field. Each panel has a `type` (value, timeseries, table), a `row`
# from 1 at the top and a relative `width`; the other keys depend on the type. A time series shows its `view`
# up to now and loads its `history`, reachable by panning while live updates are paused. A `scale` names a
# registered scale (noaa_g, noaa_s, noaa_r); own levels are given as `thresholds` instead. `valid_min` and
# `valid_max` add bounds of valid values to those of the metadata; a chart offers to hide invalid values only where any are known.

[[dashboard.panel]]
type = "value"
title = "Kp index (estimated)"
row = 1
dataset = "swpc_kp_estimated"
field = "estimated_kp"
format = "{:.2f}"
scale = "noaa_g"

[[dashboard.panel]]
type = "value"
title = "X-ray flare class"
row = 1
dataset = "swpc_goes_xray"
field = "long_flux"
format = "flare_class"
scale = "noaa_r"

[[dashboard.panel]]
type = "value"
title = "Protons >=10 MeV"
row = 1
dataset = "swpc_goes_protons"
field = "p_ge10mev_flux"
format = "{:.2e}"
unit = "pfu"
scale = "noaa_s"

[[dashboard.panel]]
type = "value"
title = "Sunspot number"
row = 1
dataset = "silso_sunspot_daily"
field = "sunspot_number"
format = "{:.0f}"

[[dashboard.panel]]
type = "timeseries"
title = "Kp index"
row = 2
view = "PT24H"
history = "P1Y"
y_range = [0, 9.5]
y_title = "Kp (0-9)"
scale = "noaa_g"
series = [
    { dataset = "Kp", field = "Kp", label = "Kp (GFZ)", style = "bars" },
    { dataset = "swpc_kp_estimated", field = "estimated_kp", label = "Estimated Kp (SWPC)", color = "#0068C9" },
]

[[dashboard.panel]]
type = "timeseries"
title = "GOES X-ray flux"
row = 2
view = "PT24H"
history = "P7D"
y_axis = "log"
y_range = [1e-9, 1e-2]
y_title = "Flux (W/m²)"
scale = "noaa_r"
series = [
    { dataset = "swpc_goes_xray", field = "long_flux", label = "Long 0.1-0.8 nm", color = "#27AE60" },
    { dataset = "swpc_goes_xray", field = "short_flux", label = "Short 0.05-0.4 nm", color = "#0068C9" },
]

[[dashboard.panel]]
type = "timeseries"
title = "GOES proton flux >=10 MeV"
row = 2
view = "PT24H"
history = "P7D"
y_axis = "log"
y_range = [0.1, 3e5]
y_title = "Flux (pfu)"
scale = "noaa_s"
series = [{ dataset = "swpc_goes_protons", field = "p_ge10mev_flux", label = "Protons >=10 MeV", color = "#FF4B4B" }]

# About three 11-year solar cycles
[[dashboard.panel]]
type = "timeseries"
title = "Sunspot number"
row = 3
view = "P35Y"
history = "P35Y"
series = [
    { dataset = "silso_sunspot_monthly", field = "sunspot_number", label = "Monthly mean", color = "rgba(255, 165, 0, 0.7)" },
    { dataset = "silso_sunspot_smoothed", field = "sunspot_number", label = "13-month smoothed", color = "#FF4B4B" },
]

[[dashboard.panel]]
type = "table"
title = "Recent CMEs"
row = 3
dataset = "cme_catalog"
history = "P90D"
count = 20
columns = [
    { field = "linear_speed", label = "Speed (km/s)" },
    { field = "width", label = "Angular width (deg)" },
    { field = "central_pa", label = "Central position angle (deg)" },
    { field = "is_halo", label = "Halo" },
    { field = "kinetic_energy", label = "Kinetic energy (erg)" },
    { field = "remarks", label = "Remarks" },
]

# Readable status of every feed, from its jobs instead of the logs
[[dashboard.panel]]
type = "feeds"
title = "Feed status"
row = 4
window = "P1D"
