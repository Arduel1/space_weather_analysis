# Feeds the pipeline service queues on start and then every `interval` (ISO 8601 duration), each over a `lookback` up to
# now or from `start` (UTC); a feed without `source_type` takes the pipeline of its datasets in the master catalog.

# GOES X-ray and proton flux of the last 90 days from the iSWA HAPI server, the history behind the live feed
[[feed]]
name = "goes"
datasets = ["goesp_xray_flux_P1M", "goesp_part_flux_P5M"]
lookback = "P90D"
interval = "PT1H"

# Live GOES X-ray, proton and electron flux of NOAA SWPC, whose rolling files are a few minutes behind the measurement.
# The 7-day lookback is the longest file SWPC offers; after the first run each run fetches from the newest stored value
# on.
[[feed]]
name = "swpc_goes"
datasets = ["swpc_goes_xray", "swpc_goes_protons", "swpc_goes_electrons"]
source_type = "SWPC"
lookback = "P7D"
interval = "PT1M"

# Real-time solar wind of SWPC from the spacecraft at L1 (the Lagrange point 1.5 million km sunward of Earth); its
# rolling files hold the last day
[[feed]]
name = "swpc_solar_wind"
datasets = ["swpc_solar_wind_plasma", "swpc_solar_wind_mag"]
source_type = "SWPC"
lookback = "P1D"
interval = "PT1M"

# Daily F10.7 solar radio flux, whose SWPC file holds the last 30 days
[[feed]]
name = "swpc_f107"
datasets = ["swpc_f107"]
source_type = "SWPC"
lookback = "P30D"
interval = "PT1H"

# Solar wind measured by STEREO A, whose beacon data reach SWPC some hours late; the file holds the last 30 days
[[feed]]
name = "swpc_stereo_a"
datasets = ["swpc_stereo_a"]
source_type = "SWPC"
lookback = "P30D"
interval = "PT30M"

# The solar wind at Earth of the newest WSA-Enlil run of SWPC, which runs a few times a day
[[feed]]
name = "swpc_enlil"
datasets = ["swpc_enlil_earth"]
source_type = "SWPC"
lookback = "P7D"
interval = "PT1H"

# Kp estimated by SWPC every minute, a nowcast until GFZ publishes the official Kp
[[feed]]
name = "swpc_kp"
datasets = ["swpc_kp_estimated"]
source_type = "SWPC"
lookback = "P7D"
interval = "PT1M"

# Image sequences of the Sun, the corona and the aurora; the frame lists of SWPC hold the last day
[[feed]]
name = "images"
datasets = [
    "swpc_suvi_094", "swpc_suvi_131", "swpc_suvi_171", "swpc_suvi_195", "swpc_suvi_284", "swpc_suvi_304",
    "swpc_lasco_c2", "swpc_lasco_c3", "swpc_ovation_north", "swpc_ovation_south", "sdo_hmi_continuum", "sdo_aia_193",
    "sdo_aia_flare_zoom", "swpc_enlil", "swpc_drap_global", "swpc_glotec_anomaly",
]
source_type = "IMAGES"
lookback = "P1D"
interval = "PT10M"

# Sunspot regions of the daily SWPC report; the file holds the last 30 days
[[feed]]
name = "swpc_regions"
datasets = ["swpc_solar_regions"]
source_type = "SWPC"
lookback = "P30D"
interval = "PT1H"

# Flares and alerts of SWPC, whose files hold the last week
[[feed]]
name = "swpc_events"
datasets = ["swpc_xray_flares", "swpc_alerts"]
source_type = "SWPC"
lookback = "P7D"
interval = "PT10M"

# Space weather events of DONKI with the links forecasters set between them; events are added, revised and linked
# days later, so every run fetches the whole lookback again (six event types, one request each)
[[feed]]
name = "donki"
datasets = ["donki_events"]
source_type = "DONKI"
lookback = "P30D"
interval = "PT1H"

# Daily positions of the planets and of the spacecraft DONKI names as targets of CMEs, a month back and ten days ahead
[[feed]]
name = "positions"
datasets = ["body_positions"]
source_type = "EPHEMERIS"
lookback = "P30D"
interval = "PT6H"

# Daily NOAA sunspot regions from the HEK since 1996, the start of solar cycle 23, for the butterfly diagram
[[feed]]
name = "hek_regions"
datasets = ["hek_noaa_regions"]
source_type = "HEK"
start = 1996-01-01T00:00:00Z
interval = "PT6H"

# The coronal magnetic field computed with the PFSS model from the newest GONG synoptic map, which GONG updates hourly;
# each hourly model is kept for a day, so that the field can be played over the day
[[feed]]
name = "gong_pfss"
datasets = ["gong_pfss"]
source_type = "GONG"
interval = "PT1H"

# OMNI hourly solar wind, magnetic field and indices since 1996 (the start of the CME catalog), the history the
# relationship views and the comparisons with the past are computed from; OMNI lags weeks behind real time
[[feed]]
name = "omni"
datasets = ["OMNI2_H0_MRG1HR"]
source_type = "HAPI"
start = 1996-01-01T00:00:00Z
interval = "PT6H"

# Hourly Dst index of the WDC for Geomagnetism, Kyoto
[[feed]]
name = "kyoto_dst"
datasets = ["hour_dst"]
source_type = "HAPI"
lookback = "P60D"
interval = "PT1H"

# 1-minute SYM-H and ASY-H of the WDC for Geomagnetism, Kyoto, whose provisional data end some days before now
[[feed]]
name = "kyoto_sym"
datasets = ["min_asysym"]
source_type = "HAPI"
lookback = "P30D"
interval = "PT3H"

# Maps of the OVATION aurora model of SWPC, which publishes only the newest one every few minutes; a day of maps is
# collected run by run
[[feed]]
name = "ovation_grid"
datasets = ["swpc_ovation_grid"]
source_type = "OVATION"
interval = "PT20M"

# Kp index of GFZ Potsdam
[[feed]]
name = "kp"
datasets = ["Kp"]
# Named, so the feed also runs without master catalog, as in the static demo
source_type = "GFZ_POTSDAM"
start = 2020-01-01T00:00:00Z
# One value per 3 hours; hourly fetches take up new and revised preliminary values soon after GFZ publishes them
interval = "PT1H"

# Half-hourly Hp30 index of GFZ Potsdam, which GFZ updates every half hour
[[feed]]
name = "hp30"
datasets = ["Hp30"]
source_type = "GFZ_POTSDAM"
lookback = "P30D"
interval = "PT30M"

# Local files, which hold their whole dataset and are not in the master catalog
[[feed]]
name = "local"
datasets = ["silso_sunspot_daily", "silso_sunspot_monthly", "silso_sunspot_smoothed", "silso_sunspot_hemispheric", "wso_polar_fields", "cme_catalog", "icme_list"]
source_type = "LOCAL"
