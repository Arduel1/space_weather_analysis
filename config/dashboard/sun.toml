# Sun: the Sun in several wavelengths and its corona, its magnetic field, its sunspots and the course of the cycle
title = "Sun"

[[panel]]
type = "images"
title = "The Sun in six extreme ultraviolet wavelengths (GOES SUVI)"
row = 1
width = 1.3
variants = [
    { dataset = "swpc_suvi_094", label = "94 A" },
    { dataset = "swpc_suvi_131", label = "131 A" },
    { dataset = "swpc_suvi_171", label = "171 A" },
    { dataset = "swpc_suvi_195", label = "195 A" },
    { dataset = "swpc_suvi_284", label = "284 A" },
    { dataset = "swpc_suvi_304", label = "304 A" },
]
history = "P1D"
columns = 3

[[panel]]
type = "images"
title = "The corona (SOHO LASCO C2 and C3)"
row = 1
variants = [{ dataset = "swpc_lasco_c2", label = "LASCO C2" }, { dataset = "swpc_lasco_c3", label = "LASCO C3" }]
history = "P1D"
columns = 2

# A close look at the newest flare DONKI logged, over the whole flare, independent of the time of the other views,
# beside the change of each frame against the one about 2 minutes earlier; below the corona, where it fills the height
# the SUVI grid gives the row
[[panel]]
type = "images"
title = "Newest flare up close (SDO AIA 131 A) and its 2-minute change"
row = 1
below = true
variants = [
    { dataset = "sdo_aia_flare_zoom", label = "AIA 131 A" },
    { dataset = "sdo_aia_flare_zoom", field = "difference_file", label = "2 min change: white brighter" },
]
# Below the 30 days from which the dashboard keeps reads for an hour, so that the zoom of a new event shows at once
history = "P29D"
columns = 2
follows_replay = false

# PFSS (potential field source surface) model: closed loops and open field lines that carry the solar wind outwards
[[panel]]
type = "fieldlines"
title = "Coronal magnetic field (PFSS model of synoptic magnetograms)"
row = 2
width = 1.5
dataset = "gong_pfss"
regions = "swpc_solar_regions"
coronal_holes = "sdo_aia_193"
events = "donki_events"
surface_images = "sdo_aia_193"

[[panel]]
type = "fieldmap"
title = "Magnetic field map in Carrington longitude"
row = 2
dataset = "gong_pfss"
regions = "swpc_solar_regions"
coronal_holes = "sdo_aia_193"
events = "donki_events"

# The visible Sun (HMI) and the corona (AIA 193 A) side by side, with the sunspot regions of the daily NOAA report moved
# with the rotation of the Sun to each image, and in AIA the coronal holes found in each image
[[panel]]
type = "sundisk"
title = "Sunspot regions and coronal holes (SDO HMI, AIA 193 A)"
row = 3
views = [{ dataset = "sdo_hmi_continuum", label = "HMI: visible light" }, { dataset = "sdo_aia_193", label = "AIA 193 A: corona" }]
regions = "swpc_solar_regions"
history = "P1D"

# The butterfly diagram since 1996 with the polar fields, the sunspot numbers, the radio flux and the CMEs below it on
# one time axis; the minima and maxima of the cycle are found in the smoothed sunspot number
[[panel]]
type = "butterfly"
title = "Butterfly diagram and solar activity over three cycles"
row = 3
dataset = "hek_noaa_regions"
cycle = { dataset = "silso_sunspot_smoothed", field = "sunspot_number" }
history = "P31Y"
rows = [
    { title = "Sunspot number, monthly mean: whole Sun and each hemisphere", series = [
        { dataset = "silso_sunspot_hemispheric", field = "sunspot_number", label = "Whole Sun", color = "--theme-sun" },
        { dataset = "silso_sunspot_hemispheric", field = "sunspot_number_north", label = "North", color = "--theme-sun", dash = "dash" },
        { dataset = "silso_sunspot_hemispheric", field = "sunspot_number_south", label = "South", color = "--theme-sun", dash = "dot" },
    ] },
    { title = "Polar magnetic field (Wilcox Solar Observatory)", y_title = "WSO units", series = [
        { dataset = "wso_polar_fields", field = "north_filtered", label = "North pole", color = "--theme-field", dash = "dash" },
        { dataset = "wso_polar_fields", field = "south_filtered", label = "South pole", color = "--theme-field", dash = "dot" },
    ] },
    { title = "F10.7 radio flux, monthly mean", series = [
        { dataset = "OMNI2_H0_MRG1HR", field = "F10_INDEX1800", resample = "P30D", stat = "mean", label = "F10.7", color = "--theme-sun" },
    ] },
    { title = "CMEs per month", series = [
        { dataset = "cme_catalog", field = "linear_speed", resample = "P30D", stat = "count", style = "bars", label = "CMEs", color = "--theme-cme" },
    ] },
]
